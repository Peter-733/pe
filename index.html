<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Peter's Tokyo Trip 2026</title>
    <style>
        :root { --primary-dark: #2c3e50; --accent-orange: #e67e22; }
        body { font-family: -apple-system, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        header { background: var(--primary-dark); color: white; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { color: var(--primary-dark); border-left: 4px solid var(--accent-orange); padding-left: 10px; font-size: 1.2rem; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-size: 16px; min-height: 120px; }
    </style>
</head>
<body>
    <header>
        <h1>🇯🇵 東京自由行 2026</h1>
        <p>5月7日出發 | Peter</p>
    </header>
    <div class="card">
        <h2>🚀 交通與住宿</h2>
        <p><strong>地點：</strong> 日本橋人形町</p>
        <p><strong>飯店：</strong> 相鐵 FRESA INN</p>
    </div>
    <div class="card">
        <h2>🎬 影評隨筆隨手記</h2>
        <textarea id="notes" placeholder="在這裡寫下你的影評靈感..."></textarea>
    </div>
    <script>
        const noteEl = document.getElementById('notes');
        noteEl.value = localStorage.getItem('tokyo_notes') || '';
        noteEl.oninput = () => localStorage.setItem('tokyo_notes', noteEl.value);
    </script>
</body>
</html>
